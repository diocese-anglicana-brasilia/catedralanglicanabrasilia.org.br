# yaml-language-server: $schema=https://unpkg.com/@sveltia/cms/schema/sveltia-cms.json

site_url: https://catedralanglicanabrasilia.org.br
display_url: https://catedralanglicanabrasilia.org.br

slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

publish_mode: editorial_workflow

output:
  omit_empty_optional_fields: true

backend:
  name: github
  branch: main
  repo: diocese-anglicana-brasilia/catedralanglicanabrasilia.org.br

media_libraries:
  cloudflare_r2:
    access_key_id: 4f2ebcd6c0017875e447b6ba96852c6f
    bucket: dab-site-catedral
    account_id: 2411adaf57eb99addd225a995f0f9246
    public_url: https://cdn.catedralanglicanabrasilia.org.br
    prefix: cms-uploads/ # Optional
    jurisdiction: default # Optional; 'default' | 'eu' | 'fedramp'
  default:
    config:
      max_file_size: 0
  all:
    max_file_size: 10240000
    filename_template: '{{year}}{{month}}{{day}}-{{uuid_short}}'
    slugify_filename: true
    transformations:
      raster_image: # original format
        format: webp # new format, only `webp` is supported
        quality: 85 # default: 85
      svg:
        optimize: true


media_folder: /public/media
public_folder: /media


collections:
  - name: news
    label: Notícias
    label_singular: Notícia
    folder: src/content/news
    slug: '{{year}}-{{month}}-{{day}}-{{slug}}'
    create: true
    summary: '{{title}} ({{date}})'
    sortable_fields:
      fields: [date, title]
      default: { field: date, direction: descending }
    fields:
      - { name: title, label: Título }
      - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
      - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - { name: date, label: Data, widget: datetime, default: '{{now}}' }
      - name: author
        label: Autor
        widget: relation
        collection: authors
        display_fields: [name]
        required: false
      - name: tags
        label: Tags
        widget: relation
        collection: tags
        multiple: true
        required: false
      - name: status
        label: Status
        widget: select
        options: [draft, published, archived]
        default: draft
      - { name: featured_image, label: Imagem de destaque, widget: image, required: false }
      - { name: excerpt, label: Resumo, widget: text, required: false }
      - { name: body, label: Conteúdo, widget: richtext }
  - name: tags
    label: Tags
    create: true
    label_singular: Tag
    publish_mode: simple
    folder: src/content/tags
    fields:
      - { name: title, label: Title }
  - name: authors
    label: Autores
    label_singular: Autor
    create: true
    folder: src/content/authors
    identifier_field: name
    fields:
      - { name: name, label: Nome }
      - { name: bio, label: Bio, widget: richtext, required: false }
      - { name: photo, label: Foto, widget: image, required: false }
      - { name: email, label: Email, required: false }
  - name: locations
    label: Locais
    label_singular: Local
    folder: src/content/locations
    identifier_field: name
    create: true
    fields:
      - { name: name, label: Nome }
      - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
      - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - { name: map_location, label: Mapa, type: Point, widget: map, required: false }
      - { name: jurisdiction, label: Jurisdição, type: Polygon , widget: map, required: false }
      - { name: address, label: Endereço, required: false }
      - { name: city, label: Cidade, required: false }
      - { name: online_url, label: URL do local online, required: false, hint: "Informe um endereço completo, começando por https:// ou http://." }
      - { name: capacity, label: Capacidade, widget: number, required: false }
  - name: events
    label: Eventos
    label_singular: Evento
    folder: src/content/events
    identifier_field: name
    create: true
    fields:
      - { name: name, label: Nome }
      - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
      - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - { name: start_date, label: Data de início, widget: datetime }
      - { name: end_date, label: Data de encerramento, widget: datetime, required: false }
      - name: location
        label: Local
        widget: relation
        collection: locations
        display_fields: [name]
        required: false
      - { name: description, label: Descrição, widget: richtext, required: false }
      - { name: registration_url, label: URL de registro, required: false }
      - { name: featured, label: Destaque, widget: boolean, default: false }
  - name: board_members
    label: Membros da Junta Paroquial
    label_singular: Membro da Junta Paroquial
    folder: src/content/board-members
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Nome }
      - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
      - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - { name: role, label: Cargo }
      - { name: bio, label: Bio, widget: richtext, required: false }
      - { name: photo, label: Foto, widget: image, required: false }
      - { name: email, label: Email, required: false }
      - widget: boolean
        name: is_active
        label: Está ativo?
        required: true
        default: true
  - name: programs
    label: Atividades
    label_singular: Atividade
    folder: src/content/programs
    create: true
    identifier_field: name
    fields:
      - { name: name, label: Nome }
      - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
      - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - { name: description, label: Descrição, widget: richtext }
      - { name: goals, label: Objetivos, widget: list, required: false }
      - { name: images, label: Imagens, widget: image, multiple: true, required: false }
      - { name: budget, label: Orçamento, widget: number, required: false }
      - { name: impact, label: Impacto, widget: richtext, required: false }
  - name: reverends
    label: Reverendo(a)s
    label_singular: Reverendo(a)
    reorder: true
    create: true
    folder: src/content/reverends
    identifier_field: name
    sortable_fields:
      fields: [start_date, end_date]
      default: { field: start_date, direction: descending }
    fields:
      - { name: name, label: Nome }
      - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
      - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - { name: role, label: Cargo }
      - { name: bio, label: Biografia, widget: richtext, required: false }
      - { name: photo, label: Foto, widget: image, required: false }
      - { name: email, label: Email, required: false }
      - { name: start_date, label: Data de início, widget: datetime, required: true }
      - { name: end_date, label: Data de fim, widget: datetime, required: false }
  - name: pages
    label: Páginas
    files:
      - name: about
        label: Sobre
        file: src/content/pages/about.md
        fields:
          - { name: title, label: Título }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - { name: body, label: Conteúdo, widget: richtext }
      - name: contact
        label: Contato
        file: src/content/pages/contact.md
        fields:
          - { name: title, label: Título }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - { name: body, label: Conteúdo, widget: richtext }
      - name: dean
        label: Reverenda Deã
        file: src/content/pages/dean.md
        fields:
          - { name: title, label: Título }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - { name: body, label: Conteúdo, widget: richtext }
      - name: leadership
        label: Liderança
        file: src/content/pages/leadership.md
        fields:
          - { name: title, label: Título }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - { name: body, label: Conteúdo, widget: richtext }
          - name: board_members
            label: Membros da Junta
            widget: relation
            collection: board_members
            display_fields: ['{{name}} - {{role}}']
            multiple: true
            required: false
      - name: reverends-gallery
        label: Galeria de reverendos
        file: src/content/pages/reverends-gallery.md
        fields:
          - { name: title, label: Título }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - { name: body, label: Conteúdo, widget: richtext }
          - name: reverends
            label: Reverendo(a)s
            widget: relation
            collection: reverends
            display_fields: ['{{name}} - de {{start_date}} a {{end_date}}']
            sort_by:
              field: _manual
            multiple: true
            required: false
      - name: donate
        label: Doar
        file: src/content/pages/donate.md
        fields:
          - { name: title, label: Título }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - { name: body, label: Body, widget: richtext }
      - name: programs
        label: Atividades
        file: src/content/pages/programs.md
        fields:
          - { name: title, label: Title }
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
          - name: programs
            label: Atividades
            widget: relation
            collection: programs
            display_fields: [name]
            multiple: true
            required: false
          - { name: body, label: Conteúdo, widget: richtext }
  - name: site_seo
    label: SEO das páginas do site
    publish_mode: simple
    files:
      - name: home
        label: Página inicial
        file: src/content/site-seo/home.md
        fields:
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - name: news
        label: Lista de notícias
        file: src/content/site-seo/news.md
        fields:
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - name: events
        label: Lista de eventos
        file: src/content/site-seo/events.md
        fields:
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - name: locations
        label: Lista de endereços
        file: src/content/site-seo/locations.md
        fields:
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - name: programs
        label: Lista de ações sociais
        file: src/content/site-seo/programs.md
        fields:
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
      - name: not-found
        label: Página não encontrada
        file: src/content/site-seo/not-found.md
        fields:
          - { name: seo_description, label: Descrição para mecanismos de busca, widget: text, required: false }
          - { name: seo_keywords, label: Palavras-chave, required: false, hint: "Separe as palavras por vírgulas." }
